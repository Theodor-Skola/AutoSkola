<!DOCTYPE html>
<html lang="se">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="mall.css">

<title>kontakta | Auto Skola</title>

</head>
<body>

<div class="header">
	<div class="storBild">
		<a class="länkStorBild" href="index.html"><img class="logga" src="AutoSkolaLoggaTransparent.png" alt="Auto Skola Logga"></a>
	</div>
	<div class="litentext">
		<a class="omOssLänk1" href="omoss.html">Om Oss</a>
		<a class="kontaktaLänk1" href="kontakta.html">Kontakta</a>
		<a class="prisLänk1" href="pris.html">Pris</a>
	</div>
</div>

<div class="Quote">
	<h1 class="QuoteText">“Kontakta”</h1>
	<p class="Quoteurce">-Theodor (superentreprenör) Wemmel</p>
</div>

<div class="formulär">
	<form class="form" id="form">
		<p class="comingSoon">Fyll i formuläret</p>
		<div class="email">
			<div class="asteriskDiv">
				<label for="mail">E-Post</label>
				<label class="asterisk" for="mail">*</label>
			</div>
			<input class="litenTextFält" type="email" name="mail" id="mail" required placeholder="susanneK@skola.barnstenens.se">
		</div>
		<div class="Namn">
			<div class="asteriskDiv">
				<label for="förNamn">Namn</label>
				<label class="asterisk" for="förNamn">*</label>
			</div>
			<input class="litenTextFält" type="text" name="förNamn" id="förNamn" required placeholder="Susanne">
			<input class="litenTextFält" type="text" name="efterNamn" id="efterNamn" required placeholder="Karlsson">
		</div>
		<div class="skolaFrån">
			<div class="asteriskDiv">
				<label for ="skolaFrån">Skola</label>
				<label class="asterisk" for="skolaFrån">*</label>
			</div>
			<input class="litenTextFält" type="text" name="skolaFrån" id="skolaFrån" required placeholder="Barnstens Gymnasiet">
		</div>
		<div class="ärKund">
			<div class="asteriskDiv">
				<label for="ärKund">Är du kund?</label>
			</div>
			<label class="switch">
				<input type="checkbox" name="ärKund" id="ärKund">
				<span class="slider"></span>
			</label>
		</div>
		<div class="medellande">
			<div class="asteriskDiv">
				<label for="meddelande">Ditt meddelande</label>
				<label class="asterisk" for="meddelande">*</label>
			</div>
			<textarea class="storTextFält" name="meddelande" id="meddelande"></textarea>
		</div>
		<button class="skickaFormulär" type="submit" id="submitButton" popovertarget="popup">Skicka<br>formulär</button>
	</form>
</div>

<dialog id="thankYouModal">
  <p class="meddelandSkickats">Tack! Ditt meddelande har skickats. 🎉</p>
  <button id="closeDialog">Stäng</button>
</dialog>

<script>


const form = document.getElementById('form');
const modal = document.getElementById('thankYouModal');
const closeBtn = document.getElementById('closeDialog');

form.addEventListener('submit', function(event) {
	console.log("start");
	// Stoppa formuläret från att ladda om sidan direkt
	event.preventDefault();

	// Lägga in kod för att faktiskt skicka formuläret (fetch)
	getData();
  
	// Visa popup-fönstret
	modal.showModal(); 
  
	// Nollställ formuläret (valfritt)
	form.reset();
});

// Stäng popupen när man klickar på knappen
closeBtn.addEventListener('click', () => {
  modal.close();
});



async function getData() {
  const url = "/api/contact";
  
  let data = {
  mail: document.getElementById("mail").value,
  förNamn: document.getElementById("förNamn").value,
  efterNamn: document.getElementById("efterNamn").value,
  skolaFrån: document.getElementById("skolaFrån").value,
  ärKund: document.getElementById("ärKund").checked,
  meddelande: document.getElementById("meddelande").value
  };
  
  let params = new URLSearchParams(data);
  
  
  let bodySt = params.toString();
  
    const response = await fetch(url, {  
		method: "POST",
		headers: {
			'Content-Type': 'application/x-www-form-urlencoded'
		  },
		  body: bodySt
		});
	
    if (!response.ok) {
      throw new Error(`Response status: ${response.status}`);
    }
  
}
</script>

<img class="avskärmare" src="Line1.png" alt="Avskärmare">

<div class="mail">
	<p class="skickaMail">Skicka ett Mail!</p>
	<p class="mailAdress">kontakt@autoskola.eu</p>
</div>

<div class="fotter">
	<a class="fotterLänk" href="omoss.html">Om oss</a>
	<a class="fotterLänkPurple" href="kontakta.html">Kontakta</a>
	<a class="fotterLänk" href="pris.html">Pris</a>
</div>

</body>
</html>
