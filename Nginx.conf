worker_processes auto;

events{
    worker_connections 1024;
}

http{



    server {
        listen 80;

        location / {
            proxy_pass http://apache:80;
        }

        location /api {
            rewrite ^/api/(.*)/?$ /$1 break;
            proxy_pass http://backend:1337/;
            
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
        }
    }
}